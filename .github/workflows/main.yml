name: Version Bump Patch PR

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  version-bump-pr:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Setup Node.js with the latest LTS version
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 'lts/*' # Use the latest LTS version of Node.js

      # Step 3: Install pnpm globally
      - name: Install pnpm
        run: npm install -g pnpm

      # Step 4: Install dependencies using pnpm
      - name: Install dependencies with pnpm
        run: pnpm install

      # Step 5: Bump patch version and create branch
      - name: Bump patch version and create branch
        id: version_bump
        run: |
          current_version=$(node -p "require('./package.json').version")
          echo "Current version: $current_version"

          # Bump the patch version
          pnpm version patch --no-git-tag-version
          new_version=$(node -p "require('./package.json').version")
          echo "New version: $new_version"

          # Create a new branch for the version bump
          branch_name="version-bump-v${new_version}-$(date +%Y%m%d%H%M%S)"
          git checkout -b $branch_name

          # Export variables for the next steps
          echo "branch_name=${branch_name}" >> $GITHUB_ENV
          echo "new_version=${new_version}" >> $GITHUB_ENV

          # Configure Git and commit the changes
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "chore: Bump version to $new_version"

          # Push the new branch to the remote
          git push origin $branch_name

      # Step 6: Create Pull Request using 'devops-infra/action-pull-request'
      - name: Create Pull Request
        uses: devops-infra/action-pull-request@v0.5.5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          source_branch: ${{ env.branch_name }}
          target_branch: main
          title: "chore: Version bump to ${{ env.new_version }}"
          template: .github/PULL_REQUEST_TEMPLATE.md
          body: "**Automated pull request**"
          reviewer: sridhar02
          assignee: sridhar02
          draft: false
          old_string: "<!-- Add your description here -->"
          new_string: "** Automatic pull request**"
          get_diff: true
          ignore_users: "dependabot"
          allow_no_diff: false
