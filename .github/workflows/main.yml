name: Version Bump Patch PR

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  version-bump-pr:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Setup Node.js with the latest LTS version
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 'lts/*'

      # Step 3: Install pnpm globally
      - name: Install pnpm
        run: npm install -g pnpm

      # Step 4: Install dependencies using pnpm
      - name: Install dependencies
        run: pnpm install

      # Step 5: Bump patch version and create branch
      - name: Bump patch version and create branch
        id: version_bump
        run: |
          current_version=$(node -p "require('./package.json').version")
          echo "Current version: $current_version"

          # Bump the patch version
          pnpm version patch --no-git-tag-version
          new_version=$(node -p "require('./package.json').version")
          echo "New version: $new_version"

          # Create a new branch for the version bump
          branch_name="version-bump-v${new_version}-$(date +%Y%m%d%H%M%S)"
          git checkout -b $branch_name

          # Export variables for the next steps
          echo "branch_name=${branch_name}" >> $GITHUB_ENV
          echo "new_version=${new_version}" >> $GITHUB_ENV

          # Configure Git and commit the changes
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "chore: Bump version to $new_version"

          # Push the new branch to the remote
          git push origin $branch_name

      # Step 6: Install GitHub CLI
      - name: Install GitHub CLI
        run: sudo apt install gh -y

      # Step 7: Create a pull request using GitHub CLI
      - name: Create a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "chore: Version bump to ${new_version}" \
            --body "This PR bumps the version to ${new_version}." \
            --head "${branch_name}" \
            --base "main" \
            --label "version bump" \
            --label "automated pr"
