name: Version Bump and Create PR

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  createPullRequest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Bump version
        run: pnpm version patch

      - name: Commit version bump changes
        run: |
          git config user.name "GitHub Action"
          git config user.email "actions@github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "chore: version bump to $(jq -r .version package.json)"

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT }}
          commit-message: "chore: version bump to $(jq -r .version package.json)"
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          signoff: false
          branch: version-bump-v$(jq -r .version package.json)
          delete-branch: true
          title: "chore: version bump to $(jq -r .version package.json)"
          body: |
            This PR includes an automatic version bump.
            - Version bumped to **$(jq -r .version package.json)**
            - Auto-generated by [create-pull-request][1]

            [1]: https://github.com/peter-evans/create-pull-request
          labels: |
            version bump
            automated pr
          assignees: ${{ github.actor }}
          reviewers: SridharKatta
          team-reviewers: |
            developers
            qa-team
          milestone: 1
          draft: false
